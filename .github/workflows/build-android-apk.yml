name: Build VESC SIMULATOR (Android APK)
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/build-android-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk VESC_SIMULATOR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VESC_SIMULATOR_apk
          path: android/VESC_SIMULATOR.apk
