name: Build VESC SIMULATOR PRO (Windows .exe)
on:
  workflow_dispatch:
  push:
    paths: ["vesc_simulator/**", ".github/workflows/build-windows-exe.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vesc_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: >
          python -m PyInstaller --noconfirm --clean --windowed --name VESC_SIMULATOR_PRO
          --add-data "profiles;profiles"
          --hidden-import can.interfaces.virtual --hidden-import can.interfaces.slcan
          --collect-submodules winrt main.py
      - run: Compress-Archive -Path dist/VESC_SIMULATOR_PRO -DestinationPath VESC_SIMULATOR_PRO_windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: VESC_SIMULATOR_PRO_windows
          path: vesc_simulator/VESC_SIMULATOR_PRO_windows.zip
